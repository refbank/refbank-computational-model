[project]
name = "refbank-computational-model"
requires-python = ">=3.11"
dependencies = [
    "jax[cpu]==0.9.2",
    "jaxlib==0.9.2",
    "numpyro==0.20.1",
    "numpy>=2.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest"]
data = [
    "redivis",
    "transformers>=5.0",
    "torch",
    "Pillow",
    "httpx[socks]",   # needed when a SOCKS proxy is configured
]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:debugging"
